format = 2
verdict = "refuse"
fault-count = 3
reports = []

[[faults]]
code = "g-opener"
location = "body line 1"
match = "exact"
line = "body line 1: [g-opener] opener Unknown is not defined; write one of \"Fact:\" = \"what was observed, with its value\" | \"Not done:\" = \"what was left out or not checked, and why; nothing when nothing was left out\" | \"Next:\" = \"the sender's own next act, or who acts next and on what condition\" | \"Correction:\" = \"the wrong value and its replacement in the hail named by re\" | \"Say again:\" = \"the wanted part of the hail named by re: a source number, body line number or header name\" | \"Propose:\" = \"a course offered for the reader to choose, not a committed next act\" | \"Verdict:\" = \"the sender’s review judgment about a named work product\" with one space after the colon and a statement of that meaning; if none fits, remove this line and preserve its meaning in a hail whose marker allows it."

[[faults]]
code = "g-empty"
location = "body line 2"
match = "exact"
line = "body line 2: [g-empty] Next has no statement; write Next: followed by one space and the sender's own next act, or who acts next and on what condition."

[[faults]]
code = "g-lines"
location = "body line 4"
match = "exact"
line = "body line 4: [g-lines] REQUEST allows at most 3 body lines; remove or combine 1 line without dropping meaning."
