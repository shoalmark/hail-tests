format = 2
verdict = "refuse"
fault-count = 1
reports = []

[[faults]]
code = "h-source-change-path"
location = "source 1"
match = "exact"
line = "source 1: missing.txt is absent at both aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa and bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb; write name:path@from..to with a regular file path present at from or to."
