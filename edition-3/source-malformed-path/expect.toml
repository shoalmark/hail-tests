format = 2
verdict = "refuse"
fault-count = 1
reports = []

[[faults]]
code = "h-source-form"
location = "source 1"
match = "exact"
line = "source 1: work:…/result.txt@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa is not a well-formed source value; write name@commit or name:path@commit or name:path@commit:first-last; use a listed name, a relative path of nonempty /-separated ASCII letter, digit, ., _ or - segments (not . or ..), and unique 7 to 64 lower-case hex commit ids; range numbers are positive decimal without leading zeros; only name:path@commit may append sha256 H with H equal to the whole file's 64 lower-case hex hash."
